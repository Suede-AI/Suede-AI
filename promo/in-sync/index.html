<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
#gl,#gl canvas{position:absolute;inset:0;display:block}
#text{position:absolute;inset:0;pointer-events:none;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.shot{position:absolute;inset:0}
.tl{color:#f3f4fb}

.tl.body{font:300 22px/1.55 Inter,sans-serif;color:rgba(226,230,246,.74);margin-top:28px;letter-spacing:.002em}
.tl.pill{display:inline-flex;align-items:center;gap:10px;margin-top:30px;font:500 14px/1 'JetBrains Mono',monospace;letter-spacing:.06em;color:rgba(235,238,255,.86);padding:11px 18px 11px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);backdrop-filter:blur(6px)}
.tl.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c,#8f9cff);box-shadow:0 0 12px var(--c,#8f9cff)}
.tl.chips{margin-top:26px;line-height:2.6}
.chip{display:inline-block;font:500 13px/1 'JetBrains Mono',monospace;letter-spacing:.05em;color:rgba(232,236,255,.82);padding:9px 14px;margin:0 5px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05)}
.chip b{color:var(--c,#9fb0ff);font-weight:500}
.tl.raw{}
.proto{display:inline-flex;align-items:center;gap:16px;width:318px;margin:0 14px 14px 0;padding:15px 18px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.proto b{font:500 18px 'JetBrains Mono';min-width:96px}
.proto span{font:300 16px/1.3 Inter;color:rgba(244,238,224,.76)}
.tl.icons{margin-top:30px}
.ico{display:inline-block;margin:0 12px 12px 0}
.ico img{width:60px;height:60px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08);display:block}
.step{font:400 30px/1.25 'Instrument Serif',serif;color:#eef3ee;margin:6px 0}
.step b{font:500 14px 'JetBrains Mono';color:var(--c,#86e3ae);letter-spacing:.1em;margin-right:14px;vertical-align:4px}
.step span{font:300 17px Inter;color:rgba(220,235,226,.62);margin-left:12px}
.shot.light .tl.h{color:#16231b;text-shadow:none}
.shot.light .tl.hi{text-shadow:none}
.shot.light .tl.body{color:rgba(28,40,32,.72)}
.shot.light .tl.pill{color:#1d2a22;border-color:rgba(0,0,0,.14);background:rgba(255,255,255,.55)}
.shot.light .tl.eyebrow{color:#2f7d55}
.w{display:inline-block;will-change:transform,opacity,filter}
.lb{position:absolute;left:0;right:0;height:0;background:#000;z-index:5}
#lbt{top:0}#lbb{bottom:0}
